<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#40566b"/>
    </marker>
    <style>
      .box { fill: #f4f8fb; stroke: #40566b; stroke-width: 1.6; rx: 10; }
      .accent { fill: #e8f3ea; stroke: #2f7d4f; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; font-size: 15px; fill: #20303d; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; font-size: 11.5px; fill: #53697c; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; font-size: 18px; font-weight: 600; fill: #20303d; }
      .edge { stroke: #40566b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <text x="30" y="36" class="title">photocat: 从提案到可运行算法包</text>
  <text x="30" y="58" class="small">数据 → 语义 KG → GNN 嵌入 → 图增强 Transformer → 候选排序 →（主动学习闭环）</text>

  <rect x="28" y="88" width="170" height="78" class="box"/>
  <text x="48" y="118" class="label">1. 数据整合</text>
  <text x="48" y="139" class="small">Materials Project 风格表</text>
  <text x="48" y="155" class="small">+ 文献语料 / 条件</text>

  <rect x="238" y="88" width="190" height="78" class="box"/>
  <text x="258" y="118" class="label">2. 语义 KG</text>
  <text x="258" y="139" class="small">本体 · NER/RE · SQLite</text>
  <text x="258" y="155" class="small">规则推理 · 链接预测</text>

  <rect x="468" y="88" width="170" height="78" class="box"/>
  <text x="488" y="118" class="label">3. GNN 嵌入</text>
  <text x="488" y="139" class="small">材料–元素子图消息传递</text>
  <text x="488" y="155" class="small">节点/池化向量</text>

  <rect x="678" y="88" width="190" height="78" class="box accent"/>
  <text x="698" y="118" class="label">4. 图增强 Transformer</text>
  <text x="698" y="139" class="small">元素 token + 图偏置注意力</text>
  <text x="698" y="155" class="small">Eg / log HER / 稳定性</text>

  <rect x="908" y="88" width="180" height="78" class="box"/>
  <text x="928" y="118" class="label">5. 候选排序</text>
  <text x="928" y="139" class="small">窗口 · 新颖性 · Pareto</text>
  <text x="928" y="155" class="small">多样性 shortlist</text>

  <path d="M 198 127 L 234 127" class="edge"/>
  <path d="M 428 127 L 464 127" class="edge"/>
  <path d="M 638 127 L 674 127" class="edge"/>
  <path d="M 868 127 L 904 127" class="edge"/>

  <rect x="238" y="204" width="190" height="52" class="box"/>
  <text x="258" y="228" class="label">语义推理</text>
  <text x="258" y="246" class="small">候选 / 丰产 / 异质结 / 解释</text>

  <rect x="678" y="204" width="190" height="52" class="box"/>
  <text x="698" y="228" class="label">不确定性 + 主动学习</text>
  <text x="698" y="246" class="small">深度集成 · 共形 · 实验预算</text>

  <path d="M 333 166 L 333 200" class="edge"/>
  <path d="M 773 166 L 773 200" class="edge"/>
  <path d="M 904 230 C 980 230 980 180 962 166" class="edge" stroke-dasharray="4 3"/>
  <text x="910" y="262" class="small">实验闭环 / 下一轮筛选</text>
</svg>
