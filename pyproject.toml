[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photocat"
version = "0.4.0"
description = "Composition band-gap prediction, small-table HER regression, and a semantic KG toolkit for photocatalytic materials"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xinyi Cui" }]
keywords = ["photocatalysis", "materials discovery", "knowledge graph", "transformer", "GNN"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
torch = ["torch>=2.2"]
dev = ["pytest>=7", "matplotlib>=3.7", "openpyxl>=3.1"]

[project.scripts]
photocat = "photocat.cli:main"

[tool.setuptools.packages.find]
include = ["photocat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
